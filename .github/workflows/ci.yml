name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Full history for git-validation

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.25.8'
          cache: true

      - name: Install system dependencies
        run: make init-dev-system

      - name: Cache dev tools
        id: cache-dev-tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.4
        with:
          path: ~/go/bin
          key: dev-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/common.mk') }}

      - name: Install Go dev tools
        if: steps.cache-dev-tools.outputs.cache-hit != 'true'
        run: make install-dev-tools

      - name: Lint
        env:
          LINT_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || 'main..HEAD' }}
        run: make lint

  lint-success:
    name: Lint
    if: always()
    needs: [lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint matrix results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint matrix failed: ${{ needs.lint.result }}"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.25.8'
          cache: true

      - name: Run tests
        run: make test

  test-success:
    name: Test
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check test matrix results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed: ${{ needs.test.result }}"
            exit 1
          fi
