# primordium's carve-outs from the Go lint baseline (.limen/lint-go.yaml),
# rendered with it by `just do lint go` (limen's book/per-language.md,
# "one baseline, per-project carve-outs").
golangci:
  linters:
    settings:
      depguard:
        rules:
          main:
            allow:
              # The library's dependencies, each one a reviewed choice.
              - modernc.org/sqlite # pure-Go sqlite, no cgo
              - github.com/lmittmann/tint # slog handler for terminals
              - github.com/mattn/go-isatty
              - github.com/getsentry/sentry-go
              - golang.org/x/crypto/blake2b
              - golang.org/x/crypto/ssh
              - github.com/forkcloser/blake3
              - golang.org/x/sys/unix
              - golang.org/x/sys/windows
              - github.com/klauspost/compress
              - github.com/klauspost/cpuid # CPU feature detection for the amd64 SIMD paths
              - github.com/klauspost/pgzip
              - github.com/pierrec/lz4
              - github.com/forkcloser/xz # forked from github.com/ulikunitz/xz for performance
              - github.com/aws/aws-sdk-go-v2
              - github.com/aws/smithy-go
licenses:
  ignore:
    # go-licenses cannot resolve the LICENSE of the gotest.tools/v3
    # submodule (google/go-licenses#186).
    - gotest.tools/v3
